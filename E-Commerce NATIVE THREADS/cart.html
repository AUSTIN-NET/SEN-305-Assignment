<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Native Threads | Cart</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <nav>
        <h1 class="logo"><a href="index.html">NATIVE THREADS</a></h1>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="shop.html">Shop</a></li>
          <li><a href="product details.html">Products</a></li>
          <li><a href="cart.html">Cart</a></li>
          <li><a href="checkout.html">Checkout</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="cart">
        <h2>Your Shopping Cart</h2>
        <table class="cart-table">
          <thead>
            <tr>
              <th>Product</th>
              <th>Price</th>
              <th>Quantity</th>
              <th>Total</th>
              <th>Remove</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>
                <div class="cart-product">
                  <img
                    src="https://www.bing.com/th/id/OIP.Et976WvFVVEuYrpY_XVb_AHaHa?w=193&h=193&c=8&rs=1&qlt=90&o=6&pid=ImgAns&rm=2"
                    alt="Classic Tee"
                  />
                  <span>Classic Tee</span>
                </div>
              </td>
              <td>$40</td>
              <td><input type="number" value="1" min="1" /></td>
              <td>$40</td>
              <td><button class="remove-btn">X</button></td>
            </tr>
            <tr>
              <td>
                <div class="cart-product">
                  <img
                    src="https://www.bing.com/th/id/OIP.KqfxkZNXZmQ1d76R146ljwHaGh?w=193&h=170&c=8&rs=1&qlt=90&o=6&pid=ImgAns&rm=2"
                    alt="Denim Jacket"
                  />
                  <span>Denim Jacket</span>
                </div>
              </td>
              <td>$120</td>
              <td><input type="number" value="1" min="1" /></td>
              <td>$120</td>
              <td><button class="remove-btn">X</button></td>
            </tr>
          </tbody>
        </table>

        <div class="cart-summary">
          <p><strong>Subtotal:</strong> $160</p>
          <p><strong>Shipping:</strong> $10</p>
          <p><strong>Total:</strong> $170</p>
          <a href="checkout.html" class="btn">Proceed to Checkout</a>
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Native Threads. All rights reserved.</p>
    </footer>
  </body>
</html>
