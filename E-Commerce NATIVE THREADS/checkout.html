<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Native Threads | Checkout</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <nav>
        <h1 class="logo"><a href="index.html">NATIVE THREADS</a></h1>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="shop.html">Shop</a></li>
          <li><a href="product details.html">Products</a></li>
          <li><a href="cart.html">Cart</a></li>
          <li><a href="checkout.html">Checkout</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="checkout">
        <h2>Checkout</h2>
        <form class="checkout-form">
          <fieldset>
            <legend>Billing Details</legend>
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" required />

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required />

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" required />
          </fieldset>

          <fieldset>
            <legend>Shipping Address</legend>
            <label for="address">Street Address:</label>
            <input type="text" id="address" name="address" required />

            <label for="city">City:</label>
            <input type="text" id="city" name="city" required />

            <label for="state">State:</label>
            <input type="text" id="state" name="state" required />

            <label for="zip">Postal Code:</label>
            <input type="text" id="zip" name="zip" required />

            <label for="country">Country:</label>
            <input type="text" id="country" name="country" required />
          </fieldset>

          <fieldset>
            <legend>Payment Method</legend>
            <label
              ><input type="radio" name="payment" value="card" required />
              Credit/Debit Card</label
            >
            <label
              ><input type="radio" name="payment" value="paypal" />
              PayPal</label
            >
            <label
              ><input type="radio" name="payment" value="bank" /> Bank
              Transfer</label
            >
          </fieldset>

          <button type="submit" class="btn">Place Order</button>
        </form>

        <aside class="order-summary">
          <h3>Order Summary</h3>
          <ul>
            <li>Classic Tee - $40</li>
            <li>Denim Jacket - $120</li>
          </ul>
          <p><strong>Subtotal:</strong> $160</p>
          <p><strong>Shipping:</strong> $10</p>
          <p><strong>Total:</strong> $170</p>
        </aside>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Native Threads. All rights reserved.</p>
    </footer>
  </body>
</html>
